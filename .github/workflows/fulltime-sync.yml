name: Manual FA Full-Time backup sync

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: euyfc-fulltime-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation
    env:
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
      SCRAPERAPI_API_KEY: ${{ secrets.SCRAPERAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - name: Require ScraperAPI key
        run: test -n "$SCRAPERAPI_API_KEY" || { echo "Add SCRAPERAPI_API_KEY in repository Actions secrets."; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run sync -- --scheduled
